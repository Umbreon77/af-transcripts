    .wnav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 6px; }
    .wnav .sp { flex: 1; }
    .wnav a[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }
    .eps { display: grid; gap: 12px; }
    .ep h3 { font-size: 1.02rem; line-height: 1.35; margin: 2px 0 6px; }
    .ep h3 a { color: var(--strong); text-decoration: none; }
    .ep h3 a:hover { color: var(--accent); }
    .ep .meta { font-size: 0.75rem; color: var(--muted); }
    .ep .blurb { font-size: 0.9rem; color: var(--text-dim); }
    .ep .blurb .k { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-right: 6px; font-style: normal; }
    .ep details { margin-top: 8px; font-size: 0.82rem; }
    .ep summary { cursor: pointer; color: var(--accent); }
    .ep summary small { color: var(--muted); }
    .chl { margin-top: 6px; columns: 2; column-gap: 24px; }
    .chl a { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 6px; break-inside: avoid; padding: 3px 0; color: var(--text-dim); text-decoration: none; font-size: 0.8rem; }
    .chl a:hover { color: var(--text); }
    .chl .t { color: var(--ts-color); font-size: 0.72rem; padding-top: 1px; }
    .q { border-left: 2px solid var(--accent); padding: 2px 0 2px 12px; margin: 0 0 14px; }
    .q p { font-size: 0.92rem; }
    .q small { display: block; font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .q small a { color: var(--ts-color); text-decoration: none; }
    .q .pl { color: var(--accent); }
    .allw { margin-top: 30px; }
    .allw summary { cursor: pointer; font-size: 0.85rem; color: var(--accent); }
    .yr { margin-top: 10px; }
    .yr b { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .yr a { display: inline-block; margin: 0 6px 6px 0; font-size: 0.78rem; padding: 2px 9px; border: 1px solid var(--border); border-radius: 999px; text-decoration: none; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .yr a:hover, .yr a[aria-current] { border-color: var(--accent); color: var(--accent); }
    @media (max-width: 640px) { .chl { columns: 1; } }

<script src="features.js"></script>
<script>
(function () {
  var esc = SF.esc, $ = function (id) { return document.getElementById(id); }, MON = SF.MON;
  var W = null, CAT = null, IDX = null, allQ = false;
  function d8(iso) { return iso.replace(/-/g, ''); }
  function range(a, b) {
    var A = d8(a), B = d8(b);
    var am = MON[+A.slice(4, 6) - 1], bm = MON[+B.slice(4, 6) - 1];
    if (A.slice(0, 4) !== B.slice(0, 4)) return am + ' ' + +A.slice(6) + ', ' + A.slice(0, 4) + ' – ' + bm + ' ' + +B.slice(6) + ', ' + B.slice(0, 4);
    return am + ' ' + +A.slice(6) + '–' + (am === bm ? '' : bm + ' ') + +B.slice(6) + ', ' + B.slice(0, 4);
  }
  function wkHref(k) { return SF.HREF.week(k); }
  function render() {
    var n = W.episodes.length;
    $('title').textContent = 'The week of ' + range(W.week, W.end);
    document.title = 'The week of ' + range(W.week, W.end) + ' — America First Transcripts';
    $('intro').textContent = n + ' episode' + (n === 1 ? '' : 's') + ', ' + range(W.week, W.end) + ' (Monday to Sunday, New York dates).';
    [['prev', W.prev], ['next', W.next]].forEach(function (p) {
      var a = $(p[0]); a.href = p[1] ? wkHref(p[1]) : '#'; a.setAttribute('aria-disabled', p[1] ? 'false' : 'true');
    });
    $('eps').innerHTML = W.episodes.map(function (e) {
      var by = e.chsrc === 'viewer' ? 'by viewer @bakeddgoron' : 'auto, from the index summaries';
      return '<article class="card ep"><div class="meta">' + SF.dateMed(e.date) + ' · ' + SF.epLabel(e) + (e.min ? ' · ' + Math.floor(e.min / 60) + 'h ' + ('0' + e.min % 60).slice(-2) + 'm' : '') + '</div>' +
        '<h3><a href="' + SF.epHref(e.u) + '">' + esc(e.h) + '</a></h3>' +
        (e.blurb ? '<p class="blurb"><span class="k">Summary · not a quote</span><i>' + esc(e.blurb) + '</i></p>' : '') +
        (e.chapters.length ? '<details><summary>Chapters (' + e.chapters.length + ') <small>· ' + by + '</small></summary><div class="chl">' +
          e.chapters.map(function (c) { return '<a href="' + SF.epHref(e.u, c[0]) + '"><span class="t mono">' + SF.hms(c[0]) + '</span><span>' + esc(c[1]) + '</span></a>'; }).join('') +
          '</div></details>' : '') + '</article>';
    }).join('') || '<div class="empty">No episodes.</div>';
    var months = {};
    W.episodes.forEach(function (e) { months[e.date.slice(0, 6)] = 1; });
    var ms = Object.keys(months).sort(), m1 = ms.length === 1 ? ms[0] : '';
    $('topics').innerHTML = W.topics.map(function (t) {
      return '<a class="chip-b" href="' + SF.HREF.research(m1 ? { mode: 'disc', topic: t[0], m: m1 } : { mode: 'disc', topic: t[0] }) + '">' + esc(t[1]) + '<span class="n">' + t[2] + '</span></a>';
    }).join('') || '<span class="note">This week\'s episodes aren\'t indexed yet.</span>';
    $('tnote').textContent = W.topics.length ? 'Counts are this week\'s segments on each topic. A topic opens its main discussions in Research' +
      (m1 ? ' for all of ' + SF.monLong(m1) : '') + ' (Research filters by month, not week).' : '';
    $('qh').textContent = 'From Nick\'s Positions (' + W.quotes.length + ')';
    $('quotes').innerHTML = W.quotes.slice(0, allQ ? W.quotes.length : 8).map(function (q) {
      var e = CAT.byId[q.tid];
      return '<div class="q"><p>❝ ' + esc(q.text) + '</p><small>' + (e ? SF.dateMed(e.date) + ' · ' + SF.epLabel(e) + ' · <a class="mono" href="' + SF.epHref(e.u, q.t) + '">' + SF.hms(q.t) + '</a>' : '') +
        ' · <a class="pl" href="' + SF.HREF.positions(q.pid) + '">' + esc(q.topic) + ' ' + esc(q.pid) + '</a></small></div>';
    }).join('') + (!allQ && W.quotes.length > 8 ? '<button type="button" class="more-btn" id="allq">Show all ' + W.quotes.length + ' quotes</button>' : '') ||
      '<div class="note">None of this week\'s lines are quoted in Positions.</div>';
    weeks();
  }
  function weeks() {
    var by = {}, h = '';
    IDX.weeks.forEach(function (w) { (by[w[0].slice(0, 4)] = by[w[0].slice(0, 4)] || []).push(w); });
    Object.keys(by).sort().reverse().forEach(function (y) {
      h += '<div class="yr"><b>' + y + '</b>' + by[y].slice().reverse().map(function (w) {
        var d = d8(w[0]);
        return '<a href="' + wkHref(w[0]) + '"' + (w[0] === W.week ? ' aria-current="page"' : '') + '>' + MON[+d.slice(4, 6) - 1] + ' ' + +d.slice(6) + ' · ' + w[1] + '</a>';
      }).join('') + '</div>';
    });
    $('weeks').innerHTML = h;
    $('allw').querySelector('summary').textContent = 'All weeks (' + IDX.weeks.length + ')';
  }
  $('quotes').addEventListener('click', function (e) { if (e.target.id === 'allq') { allQ = true; render(); } });
  Promise.all([SF.getJSON(SF.DATA + 'weeks/index.json'), SF.catalogue()]).then(function (r) {
    IDX = r[0]; CAT = r[1];
    var want = new URLSearchParams(location.search).get('w'), keys = IDX.weeks.map(function (w) { return w[0]; });
    if (keys.indexOf(want) === -1) want = keys[keys.length - 1];
    return SF.getJSON(SF.DATA + 'weeks/' + want + '.json');
  }).then(function (w) { W = w; render(); }, function (err) { $('intro').textContent = 'Could not load: ' + err.message; });
})();
</script>
